<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Manufacturing OS">
  <!-- The app logo: a spectacle blind (the open spacer in white, the blind
       in orange) on navy. Full square: a phone cuts its own shape, and the
       blind sits inside the circle Android may cut. The tab icon is
       app/icon.svg (the same, rounded, drawn bolder). PNGs:
       scripts/make-app-icons.mjs. -->
  <rect width="1024" height="1024" fill="#0b1f4d"/>
  <g transform="rotate(-32 512 512)"><rect x="420" y="462" width="184" height="100" rx="12" fill="#ffffff"/><circle cx="300" cy="512" r="168" fill="#ffffff"/><circle cx="300" cy="512" r="84" fill="#0b1f4d"/><circle cx="724" cy="512" r="168" fill="#f26a1b"/></g>
</svg>
