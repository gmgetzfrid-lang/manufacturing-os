[package]
name = "tracepoint"
version.workspace = true
edition.workspace = true
description = "TracePoint"
build = "build.rs"

[[bin]]
name = "TracePoint"
path = "src/main.rs"

[dependencies]
tp-core = { path = "../core" }
serde_json = "1"
wry = "0.53"
tao = "0.34"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_NetworkManagement_WNet"] }

[build-dependencies]
embed-resource = "3"
