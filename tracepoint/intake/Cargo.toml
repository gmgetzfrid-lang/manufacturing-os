[package]
name = "scan-intake"
version = "1.0.0"
edition.workspace = true
description = "Scan Intake"
build = "build.rs"

[lib]
name = "intake"
path = "src/lib.rs"

[[bin]]
name = "ScanIntake"
path = "src/main.rs"

[dependencies]
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wry = "0.53"
tao = "0.34"
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Security_Cryptography", "Foundation", "Foundation_Collections", "Globalization", "Win32_System_WinRT"] }

[build-dependencies]
embed-resource = "3"
