[package]
name = "tracepoint"
version = "2.0.0"
edition = "2021"
description = "TracePoint: find any THOR document by equipment, tag, type or words"
build = "build.rs"

[[bin]]
name = "TracePoint"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui_extras = { version = "0.37", features = ["image", "gif"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
zstd = "0.14"
regex = "1"
rust_xlsxwriter = "0.99"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
