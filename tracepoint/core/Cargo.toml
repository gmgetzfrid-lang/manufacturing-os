[package]
name = "tp-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
rayon = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
