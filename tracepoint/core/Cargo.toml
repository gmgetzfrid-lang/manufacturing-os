[package]
name = "tp-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
rayon = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
rust_xlsxwriter = "0.99"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
